services:
  postgres:
    image: postgres:18
    container_name: postgres-de
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"  
    volumes:
      - postgres_data:/var/lib/postgresql 

    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d de_db"]
        interval: 5s
        timeout: 5s
        retries: 5   

  etl:
    build: ./python/day14/mini_project
    depends_on:
      postgres:
        condition: service_healthy
    environment:
        DB_HOST: ${DB_HOST}
        DB_PORT: ${DB_PORT}
        DB_NAME: ${DB_NAME}
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}    


volumes:
  postgres_data:
    external: true      

